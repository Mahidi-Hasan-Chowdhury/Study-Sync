<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="content">
    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/classroom/{id}(id=${classroomId})}" class="text-decoration-none me-2">
            <i class="bx bx-arrow-back fs-4"></i>
        </a>
        <div>
            <h4 class="mb-0">Classroom Materials</h4>
            <small class="text-muted">Shared PDFs and resources</small>
        </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bx bx-check-circle"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header Card with Storage Info -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h5 class="mb-1">📁 Classroom Materials</h5>
                    <p class="text-muted mb-0 small">
                        <span th:text="${#lists.size(pdfs)} + ' files'">0 files</span> •
                        <span th:text="${totalStorage / 1024 / 1024 + ' MB used'}">0 MB used</span>
                    </p>
                </div>
                <div th:if="${isOwner}">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">
                        <i class="bx bx-upload me-2"></i>Upload PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${pdfs == null or pdfs.isEmpty()}" class="card text-center py-5">
        <div class="card-body">
            <div class="mb-3">
                <i class="bx bx-file display-4 text-muted"></i>
            </div>
            <h5>No materials yet</h5>
            <p class="text-muted" th:text="${isOwner} ? 'Upload PDF files to share with your classroom members.' : 'Waiting for classroom owner to upload materials.'">Upload PDF files to share with your classroom members.</p>
            <button th:if="${isOwner}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="bx bx-upload me-2"></i>Upload First PDF
            </button>
        </div>
    </div>

    <!-- PDFs Grid -->
    <div th:if="${pdfs != null and not pdfs.isEmpty()}" class="row g-4">
        <div th:each="pdf : ${pdfs}" class="col-md-6 col-lg-4">
            <div class="card h-100 hover-border-primary">
                <div class="card-body">
                    <div class="d-flex align-items-start mb-3">
                        <div class="avatar bg-danger bg-opacity-10 text-danger rounded me-3">
                            <div class="avatar-content">
                                <i class="bx bxs-file-pdf fs-4"></i>
                            </div>
                        </div>
                        <div class="flex-grow-1">
                            <h6 class="mb-1 text-truncate" th:text="${pdf.originalName}" style="max-width: 200px;">filename.pdf</h6>
                            <small class="text-muted">
                                <span th:text="${pdf.formattedFileSize}">2.3 MB</span> •
                                <span th:text="${#temporals.format(pdf.uploadedAt, 'MMM dd, yyyy')}">Jan 15, 2024</span> •
                                By: <span th:text="${pdf.uploadedByName} ?: 'Unknown'">User</span>
                            </small>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a th:href="@{/classroom/pdf/{id}/download(id=${pdf.id})}"
                           class="btn btn-sm btn-outline-primary flex-grow-1">
                            <i class="bx bx-download me-1"></i>Download
                        </a>
                        <button th:if="${isOwner}"
                                onclick="deletePdf('${pdf.id}', this)"
                                class="btn btn-sm btn-outline-danger">
                            <i class="bx bx-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Upload PDF</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/classroom/{id}/upload(id=${classroomId})}" method="POST" enctype="multipart/form-data" id="uploadForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="pdfFile" class="form-label">Select PDF File</label>
                            <input type="file" class="form-control" id="pdfFile" name="pdfFile"
                                   accept=".pdf" required />
                            <small class="text-muted">Maximum file size: 10 MB</small>
                        </div>

                        <!-- Progress bar -->
                        <div id="uploadProgress" class="d-none">
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated"
                                     role="progressbar" style="width: 100%">Uploading...</div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-label-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="uploadBtn">
                            <i class="bx bx-upload me-2"></i>Upload PDF
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
function deletePdf(pdfId, btnElement) {
    if (!confirm('Are you sure you want to delete this PDF?')) {
        return;
    }

    // Disable button and show loading
    btnElement.disabled = true;
    btnElement.innerHTML = '<i class="bx bx-spinner bx-spin"></i>';

    fetch('/classroom/pdf/' + pdfId, {
        method: 'DELETE'
    })
    .then(response => {
        if (response.ok) {
            // Remove the card from DOM
            const card = btnElement.closest('.col-md-6');
            card.remove();

            // Check if empty
            const remainingCards = document.querySelectorAll('[class*="col-md-6"]');
            if (remainingCards.length === 0) {
                location.reload();
            }
        } else {
            return response.text().then(text => {
                alert('Failed to delete: ' + text);
                btnElement.disabled = false;
                btnElement.innerHTML = '<i class="bx bx-trash"></i>';
            });
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Failed to delete PDF');
        btnElement.disabled = false;
        btnElement.innerHTML = '<i class="bx bx-trash"></i>';
    });
}

// Handle form submission
document.getElementById('uploadForm')?.addEventListener('submit', function(e) {
    const fileInput = document.getElementById('pdfFile');
    const maxSize = 10 * 1024 * 1024; // 10 MB

    if (fileInput.files.length > 0 && fileInput.files[0].size > maxSize) {
        e.preventDefault();
        alert('File size exceeds 10 MB limit');
        return;
    }

    // Show progress
    document.getElementById('uploadProgress').classList.remove('d-none');
    document.getElementById('uploadBtn').disabled = true;
});
</script>

</html>
